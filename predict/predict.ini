# Example Configuration File for Prediction Pipeline
# ==================================================
#
# This file demonstrates all available configuration parameters for predict.py
#
# Usage:
#   python predict.py --config predict_config.ini --model_path model.keras --batch_dir /data
#
# Override any parameter via command line:
#   python predict.py --config predict_config.ini --model_path model.keras --batch_dir /data --threshold 0.4


# =============================================================================
# INFERENCE PARAMETERS
# =============================================================================
[inference]
# Batch size for model inference (larger = faster but more memory)
batch_size = 32

# Video frame rate (frames per second) for time stamp calculation
fps = 50.0

# Moving average window size for temporal smoothing
ma_window = 10

# Bat probability threshold for plots and GIF display
# Sequences with bat probability >= threshold will be highlighted
threshold = 0.5

# Probability metric for sorting/display
# Options: average, median, max, top_frac, or None (generates all four)
# Leave blank or set to None to generate grids for all metrics
metric = top_frac

# Minimum image dimension (width and height in pixels)
# Frames smaller than this are marked as NA and excluded from prediction
# Leave blank or set to None to disable filtering
min_dimensions =


# =============================================================================
# PATHS
# =============================================================================
[paths]
# Subdirectory name containing GIFs (relative to video directory)
gifs_subdir = gifs

# Subdirectory name containing motion frame crops (relative to video directory)
motion_subdir = motion_frames_unpadded

# Optional path to JSON file with annotation button configuration
# Format: {"key": "Button Label", ...}
# Example: {"bat": "Bat", "bird": "Bird", "human": "Human", "other": "Other"}
# Leave blank to use defaults
annotation_dict =


# =============================================================================
# VISUALISATION
# =============================================================================
[visualisation]
# Whether to generate interactive HTML visualisation grid
html_grid = true

# Whether to display high-confidence bat detections in OpenCV windows
# Press 'q' to advance to next sequence
display_gifs = false

# Spacebar toggles autoplay mode within motion_grid.html
auto_play = false

# Sort HTML grid by this class's probability
# Options: bat, bird, human, or None (filename order)
# Leave blank for filename order
sort_grid = 

# Whether to show skipped files (below minimum event length) within the motion_grid.html
skipped_files = false
