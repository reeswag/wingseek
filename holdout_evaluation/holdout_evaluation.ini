# Example Configuration File for Holdout Evaluation
# ==================================================
#
# This file demonstrates all available configuration parameters for holdout_evaluation.py
# Usage:
#   python holdout_evaluation.py --config holdout_config.ini --csv predictions.csv --threshold 0.404
#
# Override any parameter via command line:
#   python holdout_evaluation.py --config holdout_config.ini --csv predictions.csv --threshold 0.404


# =============================================================================
# INPUT COLUMNS
# =============================================================================
[input]
# Column name containing event identifiers (unique ID for each detection)
event_col = file

# Column name containing ground truth labels (bat, bird, human, other)
label_col = label

# Column name containing free-text notes for emergence detection
# Emergences are identified by pattern matching (e.g., "emergence", "emerging")
notes_col = notes

# Column name containing predicted bat probabilities [0, 1]
# Common options: average_probability, median_probability, max_probability, top_frac_probability
score_col = average_probability


# =============================================================================
# EVALUATION PARAMETERS
# =============================================================================
[evaluation]
# Maximum number of threshold points for curve generation
# Higher values provide smoother curves but increase computation time
# Useful to reduce for very large datasets
max_thresholds = 5000


# =============================================================================
# OUTPUT
# =============================================================================
[output]
# Directory where all results will be saved
# Created automatically if it doesn't exist
out_dir = output


# =============================================================================
# DURATION BASELINE
# =============================================================================
[duration]
# Method for calculating duration-based workload reduction
# Options:
#   events - Use sum of event durations as denominator (100% = review all detected events)
#   videos - Use total source video duration as denominator (100% = review all footage)
baseline = events

# Total source video duration (required when baseline = videos)
# Accepts multiple formats:
#   - HH:MM:SS (e.g., 41:26:44)
#   - MM:SS (e.g., 90:30)
#   - Time with units (e.g., 41h26m44s, 41h 26m 44s, 90m, 1.5h)
#   - Seconds (e.g., 149204)
# Leave blank or comment out when using baseline = events
# video_total = 41:26:44
