# Configuration File for Holdout Evaluation and results reproduction
# ==================================================================
#
# Usage:
#   python holdout_evaluation_loo.py --config holdout_config_loo.ini --csv holdout_evaluation_LOO.csv --threshold 0.404

# =============================================================================
# INPUT COLUMNS
# =============================================================================
[input]
# Column name containing event identifiers
# unique ID for each detection
event_col = file

# Column identifying the independent held-out site/group used for LOO validation
site_col = site

# Column name containing ground truth labels (bat, bird, human, other)
label_col = label

# Column name containing free-text notes for emergence detection
notes_col = notes

# SCORE MODE
# ----------
# Set this to ONE score column to reproduce single-score analysis, e.g.:
# score_col = top_frac_probability
#
# Leave blank, omit, or comment out score_col to run LOO pooling selection across
# all available standard pooling columns:
#   average_probability
#   median_probability
#   max_probability
#   top_frac_probability
#
# In LOO mode, each site is omitted in turn. The best pooling method is selected
# using Average Precision (AP) across the remaining N-1 sites. That selected
# method is then applied to the omitted site.
#
# The omitted-site predictions are combined internally to calculate the headline
# out-of-fold performance metrics, ROC/PR curves, threshold metrics and workload
# analyses.
#
# The LOO-specific CSV outputs are:
#   loo_pooling_selection_by_fold.csv
#   loo_pooling_stability.csv
score_col =


# =============================================================================
# EVALUATION PARAMETERS
# =============================================================================
[evaluation]
max_thresholds = 5000


# =============================================================================
# OUTPUT
# =============================================================================
[output]
out_dir = output


# =============================================================================
# DURATION BASELINE
# =============================================================================
[duration]
# Options: events or videos
baseline = videos

# Required when baseline = videos
video_total = 41:26:44
