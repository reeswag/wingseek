# Configuration File for Classification Training Pipeline
# ================================================================
# Usage:
#   python classification_training.py --config example_config.ini
#
# Override any parameter via command line:
#   python classification_training.py --config example_config.ini --epochs 50


# =============================================================================
# PATHS
# =============================================================================
[paths]
# Directory containing class subdirectories (1_bat, 2_bird, 3_human, 4_other)
data_dir = path/to/data

# Directory where all outputs will be saved
output_dir = path/to/output


# =============================================================================
# IMAGE PARAMETERS
# =============================================================================
[image]
# Minimum image dimensions - images smaller than this are excluded
min_dimensions = 10

# Target image size for training (height x width)
img_height = 64
img_width = 64

# Number of channels (1 for grayscale, 3 for RGB)
channels = 1


# =============================================================================
# TRAINING HYPERPARAMETERS
# =============================================================================
[training]
# Batch size for training
batch_size = 64

# Number of training epochs
epochs = 25

# Number of folds for cross-validation
k_folds = 16

# Whether to use class weighting to handle imbalanced data
use_class_weights = true

# Additional weight multiplier for the bat class (primary class of interest)
bat_weight_multiplier = 2.0


# =============================================================================
# CIFAR-10 PRE-TRAINING
# =============================================================================
[cifar_pretrain]
# Whether to pre-train the backbone on CIFAR-10 before fine-tuning
enabled = true

# Number of epochs for CIFAR-10 pre-training
epochs = 15

# Batch size for CIFAR-10 pre-training
batch_size = 256

# Validation split for CIFAR-10 (fraction of training data)
val_split = 0.1

# Learning rate for CIFAR-10 pre-training
learning_rate = 0.001


# =============================================================================
# FINE-TUNING PARAMETERS
# =============================================================================
[fine_tuning]
# Learning rate for main fine-tuning phase
learning_rate = 0.0001

# Number of epochs to train only the classification head before full fine-tuning
head_start_epochs = 5

# Learning rate for head-only training phase
head_start_lr = 0.0003


# =============================================================================
# MODEL ARCHITECTURE
# =============================================================================
[model]
# Number of filters in the initial convolutional layer
initial_filters = 32

# Dropout rate applied before the classification head
dropout_rate = 0.3

# Whether to use Squeeze-and-Excitation blocks for channel attention
use_se = true

# L2 regularization weight decay coefficient
weight_decay = 0.0001


# =============================================================================
# THRESHOLD CALIBRATION
# =============================================================================
[threshold]
# Strategy for selecting the optimal decision threshold for bat detection
# Options: fbeta, precision_constrained, recall_constrained
strategy = fbeta

# Beta value for F-beta score (values > 1 favour recall, < 1 favour precision)
beta = 2.0

# Target minimum precision (only used with precision_constrained strategy)
target_precision = 0.8

# Target minimum recall (only used with recall_constrained strategy)
target_recall = 0.9


# =============================================================================
# PIPELINE CONTROL
# =============================================================================
[pipeline]
# Whether to generate visualizations of data augmentation transformations
visualise_transformations = false

# Whether to perform k-fold cross-validation
k_fold_val = true

# Whether to train a final production model on all available data
train_production_model = true

# Fraction of sites to reserve for holdout evaluation (0.0 to 1.0)
holdout_fraction = 0.2

# Random seed for reproducibility
random_seed = 1234