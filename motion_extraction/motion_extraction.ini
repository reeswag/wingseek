# ==============================================================================
# Motion Extraction Configuration File
# ==============================================================================
#
# This INI file provides a template for configuring all parameters in the
# motion_extraction.py pipeline. Parameters can be supplied via:
#   1. Command-line arguments (highest priority)
#   2. This INI file (if provided via --config)
#   3. Default values in the script (lowest priority)
#
# Usage:
#   python motion_extraction.py --config motion_extraction.ini
#
# Override INI values with CLI arguments:
#   python motion_extraction.py --config motion_extraction.ini --mog-history 100
#
# ==============================================================================

[InputOutput]
# Root directory containing input videos
video_dir = path_to_input_directory

# Output directory for analysis results (crops, GIFs, logs, metrics)
analysis_dir = path_to_output_directory

# Optional CSV file with 'input' and 'output' columns for batch processing
# Leave empty or comment out if not using CSV input
csv_path =

# Comma-separated list of allowed video file extensions
allowed_exts = mp4,avi,mts

# Archive processed outputs to tar files (True/False)
ARCHIVE_OUTPUTS = False

# ==============================================================================

[MOG2]
# MOG2 Background Subtraction Parameters

# Enable interactive parameter tuning interface with live trackbar preview
motion_tuner_flag = False

# Number of frames for building initial background model
# Shorter history = faster adaptation but less robust to transient objects
mog_history = 50

# Variance threshold for pixel classification (in standard deviations)
# Lower values = more sensitive to subtle motion but may trigger false positives
var_threshold = 10

# Shadow detection flag (0=disabled, 1=enabled)
# Disabled for infrared footage where shadows are not present
detect_shadows = 0

# Morphological kernel size in pixels (for opening/closing operations)
# Used to remove sensor noise whilst preserving object boundaries
kernel_size = 5

# Minimum blob area in pixels²
# Smaller regions are discarded as sensor noise
motion_threshold_min = 10

# Maximum blob area in pixels²
# Larger regions typically represent background motion or illumination changes
motion_threshold_max = 50000

# ==============================================================================

[RapidScan]
# Rapid Scanning Parameters
# For fast initial video scanning (disabled in paper analysis)

# Duration for rapid scan mode in seconds (0=disabled)
rapid_scan_seconds = 0

# Frame subsampling rate for rapid scan mode
skip_factor = 2

# ==============================================================================

[Tracking]
# Motion Tracking and Kalman Filter Parameters

# Bounding box merge threshold as fraction of frame diagonal
# Used for IoU-based merging to prevent duplicate tracks
# Default 0.01 = 10px in 1080p video (scaled for aspect ratio)
min_distance_ratio = 0.01

# Maximum detections per frame before skipping
# Prevents camera shake from triggering motion events
trigger_threshold = 15

# Maximum seconds a track persists without matching detections
# Accommodates temporary occlusions and missed detections
tracking_buffer = 0.15

# Maximum normalised distance for track-detection association
# Predicted positions beyond this threshold are considered unmatched
tracking_distance = 0.15

# Area similarity weight in Hungarian matching cost function
# cost = spatial_distance + area_weight × |area_difference|/mean_area
# Stabilises tracking in 3D scenes without depth information
area_weight = 0.01

# Minimum frames required for GIF generation
# Shorter events are skipped as noise
min_event_length = 3

# ==============================================================================

[ROI]
# Region of Interest and Heatmap Parameters

# Enable interactive ROI polygon drawing for excluding background motion
mask_tuner_flag = False

# Seconds to skip before heatmap sampling
# Avoids motion triggered by camera and lighting setup
mask_starting_point = 2000

# Number of temporal samples for heatmap generation
heatmap_samples = 20

# Tolerance for merging adjacent event mask intervals (in frames)
# Set to 1 to merge intervals separated by 1 frame
ADJACENT_TOL = 0

# ==============================================================================

[Output]
# Output Generation Flags

# Enable IoU-based bounding box merging to prevent duplicate tracks
merge_bb = True

# Save binary foreground masks alongside cropped motion frames
save_masks = False

# Save foreground cutouts (bitwise_and of frame and mask)
save_fg = False

# ==============================================================================

[Tuning]
# Parameter Tuning Utilities

# Float trackbar scaling factor for GUI tuners
# Allows increments of 1/FLOAT_SCALE (e.g., 1000 = 0.001 increments)
FLOAT_SCALE = 1000

# Playback speed multiplier for motion tuner interface
playback_speed = 1.0

# ==============================================================================

[Annotations]
# Annotation Dictionary
# Mapping of annotation keys to display labels in HTML interface
# Format: key = value

bat = Bat
bird = Bird
other = Other
human = Human

# ==============================================================================
# End of Configuration File
# ==============================================================================
